name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==5.13.2"

      - name: Build EXE
        run: |
          pyinstaller camera_viewer_windows.spec --noconfirm

      - name: Download VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"

      - name: Build installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Viewer-Setup
          path: dist\Camera Viewer Setup.exe
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>&1; $true
          gh release create latest "dist\Camera Viewer Setup.exe" `
            --title "Camera Viewer - Ultima versione" `
            --notes "Build automatica — commit ${{ github.sha }}" `
            --latest
