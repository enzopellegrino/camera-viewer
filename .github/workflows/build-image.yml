name: Build Distributable Image

# Scarica l'immagine base dalla release, aggiunge il menu installer (GRUB),
# ricomprime e carica il file finale sulla stessa release.
#
# Prerequisito: la release deve contenere "camera-viewer-base.img.xz"
# (immagine prodotta da make-image.sh sul NUC, senza installer).
#
# Output: "camera-viewer-vX.Y.img.xz" caricato sulla stessa release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag della release (es. v2.1)'
        required: true
        default: 'v2.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta variabili
        id: vars
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=$VERSION"  >> $GITHUB_OUTPUT
          echo "Tag: $TAG  |  Versione: $VERSION"
          df -h .

      # ── Crea release se non esiste ────────────────────────────────────────────
      - name: Crea release se non esiste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          VERSION=${{ steps.vars.outputs.version }}
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Camera Viewer v${VERSION}" \
              --notes "$(printf '## Camera Viewer v%s\n\n### Novità\n- Splash GRUB con branding Camera Viewer by Enzo Pellegrino\n- Hotspot WiFi automatico (CameraViewer-XXXX / cameraviewer) quando non c'\''è rete\n- Boot silenzioso: nessun testo che scorre all'\''avvio\n- Menu GRUB con countdown 15s\n\n### Come flashare su USB\n```bash\nbash make-usb.sh /dev/diskX\n```\no con Balena Etcher → `camera-viewer-%s.img.xz`' "$VERSION" "$TAG")"
            echo "✓ Release $TAG creata"
          else
            echo "✓ Release $TAG già esistente"
          fi

      # ── Download immagine base ─────────────────────────────────────────────
      - name: Download immagine base dalla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          # Prova prima il tag corrente, fallback a v2.0 (contiene la base NUC)
          if ! gh release download "$TAG" \
              --pattern "camera-viewer-base.img.xz" --dir /tmp 2>/dev/null; then
            echo "Base non trovata in $TAG — scarico da v2.0 come fallback"
            gh release download v2.0 \
              --pattern "camera-viewer-base.img.xz" --dir /tmp
          fi
          ls -lh /tmp/camera-viewer-base.img.xz

      # ── Decomprimi ────────────────────────────────────────────────────────
      - name: Decompressione immagine
        run: |
          echo "Decompressione in corso..."
          xz -d -T0 /tmp/camera-viewer-base.img.xz
          ls -lh /tmp/camera-viewer-base.img
          df -h .

      # ── Monta e modifica ──────────────────────────────────────────────────
      - name: Monta immagine e aggiungi installer
        run: |
          IMG=/tmp/camera-viewer-base.img
          MNT=/mnt/cv-img

          LOOP=$(sudo losetup -f --show -P "$IMG")
          echo "Loop device: $LOOP"

          sudo mkdir -p $MNT
          sudo mount ${LOOP}p2 $MNT
          sudo mkdir -p $MNT/boot/efi
          sudo mount ${LOOP}p1 $MNT/boot/efi

          # ── Script installer ───────────────────────────────────────────
          sudo cp tools/install-camera-viewer.sh $MNT/usr/local/bin/install-camera-viewer.sh
          sudo chmod 755 $MNT/usr/local/bin/install-camera-viewer.sh
          echo "✓ Script installer copiato"

          # ── Servizio systemd ───────────────────────────────────────────
          sudo tee $MNT/etc/systemd/system/cv-installer.service > /dev/null << 'EOF'
          [Unit]
          Description=Camera Viewer Installer
          ConditionKernelCommandLine=cv_install=1
          After=local-fs.target
          DefaultDependencies=no
          Conflicts=camera-bootmode.service camera-webconfig.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/install-camera-viewer.sh
          StandardInput=tty
          StandardOutput=tty
          StandardError=tty
          TTYPath=/dev/tty1
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo mkdir -p $MNT/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/cv-installer.service \
            $MNT/etc/systemd/system/multi-user.target.wants/cv-installer.service
          echo "✓ Servizio systemd abilitato"

          # ── Fix: network-wait-online non blocca il boot senza rete ────
          sudo ln -sf /dev/null $MNT/etc/systemd/system/systemd-networkd-wait-online.service
          sudo ln -sf /dev/null $MNT/etc/systemd/system/NetworkManager-wait-online.service 2>/dev/null || true
          echo "✓ network-wait-online mascherato"

          # ── Hotspot WiFi fallback (file da repo) ───────────────────────
          sudo cp tools/cv-hotspot.sh     $MNT/usr/local/bin/cv-hotspot.sh
          sudo cp tools/cv-hotspot.service $MNT/etc/systemd/system/cv-hotspot.service
          sudo chmod 755 $MNT/usr/local/bin/cv-hotspot.sh
          sudo mkdir -p $MNT/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/cv-hotspot.service \
            $MNT/etc/systemd/system/multi-user.target.wants/cv-hotspot.service
          echo "✓ Hotspot WiFi fallback configurato (CameraViewer-XXXX / cameraviewer)"

          # ── Boot silenzioso: quiet splash (niente testo che scorre) ────
          sudo sed -i \
            's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"/' \
            $MNT/etc/default/grub
          grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' $MNT/etc/default/grub || \
            echo 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"' | sudo tee -a $MNT/etc/default/grub
          sudo sed -i \
            's/^GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR="Camera Viewer"/' \
            $MNT/etc/default/grub
          grep -q '^GRUB_DISTRIBUTOR=' $MNT/etc/default/grub || \
            echo 'GRUB_DISTRIBUTOR="Camera Viewer"' | sudo tee -a $MNT/etc/default/grub
          echo "✓ /etc/default/grub: quiet splash + distributor Camera Viewer"

          # ── Splash GRUB: immagine Camera Viewer by Enzo Pellegrino ─────
          sudo apt-get install -y imagemagick fonts-dejavu-core 2>/dev/null | tail -1
          FONT_BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          convert -size 1920x1080 \
            -define gradient:angle=150 gradient:'#060d1a-#0e2040' \
            -fill '#1a7fd4' \
            -font "$FONT_BOLD" -pointsize 100 \
            -gravity Center -annotate 0x0+0-110 'Camera Viewer' \
            -fill '#4da6ff' \
            -font "$FONT_REG" -pointsize 38 \
            -gravity Center -annotate 0x0+0+20 'by Enzo Pellegrino' \
            -fill '#3a5070' \
            -font "$FONT_REG" -pointsize 24 \
            -gravity South -annotate 0x0+0+40 \
            'Usa le frecce per navigare · Invio per selezionare' \
            /tmp/cv-grub-bg.png 2>/dev/null \
          || convert -size 1920x1080 xc:'#060d1a' /tmp/cv-grub-bg.png
          sudo cp /tmp/cv-grub-bg.png $MNT/boot/grub/cv-grub-bg.png
          echo "✓ Splash GRUB generata (1920x1080)"

          # ── GRUB: leggi kernel e initrd dal grub.cfg esistente ───────
          GRUB_CFG=$MNT/boot/grub/grub.cfg

          # Rinomina Ubuntu → Camera Viewer nel menuentry principale
          sudo sed -i "s/menuentry 'Ubuntu'/menuentry 'Camera Viewer'/"  $GRUB_CFG
          sudo sed -i 's/menuentry "Ubuntu"/menuentry "Camera Viewer"/'  $GRUB_CFG

          KERNEL=$(sudo grep -oP '/boot/vmlinuz-\S+' $GRUB_CFG | head -1)
          INITRD=$(sudo grep -oP '/boot/initrd\.img-\S+' $GRUB_CFG | head -1)
          echo "Kernel: $KERNEL"
          echo "Initrd: $INITRD"

          if [ -z "$KERNEL" ] || [ -z "$INITRD" ]; then
            echo "::error::Kernel o initrd non trovati in grub.cfg"
            sudo cat $GRUB_CFG || true
            exit 1
          fi

          # Aggiungi in fondo a grub.cfg (GRUB usa l'ultima assegnazione → override sicuro):
          # 1. Setup grafico: background Camera Viewer by Enzo Pellegrino
          # 2. Timeout 15s con menu visibile
          # 3. Voce installer
          sudo tee -a $GRUB_CFG > /dev/null << EOF

          # ── Camera Viewer: grafica e timeout ──────────────────────────
          insmod all_video
          insmod gfxterm
          insmod png
          set gfxmode=auto
          set gfxpayload=keep
          terminal_output gfxterm
          background_image /boot/grub/cv-grub-bg.png
          set menu_color_normal=white/black
          set menu_color_highlight=black/white

          set timeout_style=menu
          set timeout=15

          menuentry "  Installa Camera Viewer v${{ steps.vars.outputs.version }} su disco interno" {
              linux $KERNEL root=LABEL=cv-system cv_install=1 systemd.unit=multi-user.target quiet splash
              initrd $INITRD
          }
          EOF
          echo "✓ Menu GRUB: splash + timeout=15s + voce Installa aggiunti in fondo a grub.cfg"

          # ── Smonta ────────────────────────────────────────────────────
          sudo umount $MNT/boot/efi
          sudo umount $MNT
          sudo losetup -d $LOOP
          echo "✓ Immagine modificata e smontata"

      # ── Ricomprimi ────────────────────────────────────────────────────────
      - name: Ricompressione immagine
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          echo "Compressione xz -6 in corso (~5 min)..."
          # Copia prima il .img per l'upload non compresso (Etcher-friendly)
          cp /tmp/camera-viewer-base.img "camera-viewer-${TAG}.img"
          xz -6 -T0 /tmp/camera-viewer-base.img
          mv /tmp/camera-viewer-base.img.xz "camera-viewer-${TAG}.img.xz"
          ls -lh "camera-viewer-${TAG}.img.xz" "camera-viewer-${TAG}.img"
          df -h .

      # ── Pubblica ──────────────────────────────────────────────────────────
      - name: Carica immagine sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          IMG_XZ="camera-viewer-${TAG}.img.xz"
          IMG_RAW="camera-viewer-${TAG}.img"

          # .img.xz — compresso, per dd e per chi ha poco spazio
          gh release upload "$TAG" "$IMG_XZ" --clobber
          # .img — non compresso, Balena Etcher lo legge direttamente
          gh release upload "$TAG" "$IMG_RAW" --clobber

          echo ""
          echo "✅ Immagini pubblicate su release $TAG:"
          echo "   $(ls -lh $IMG_XZ | awk '{print $5, $9}')  ← dd / macOS"
          echo "   $(ls -lh $IMG_RAW | awk '{print $5, $9}')  ← Balena Etcher"
          echo ""
          echo "Balena Etcher → scegli camera-viewer-${TAG}.img"
          echo "dd (macOS)    → xz -dc $IMG_XZ | sudo dd of=/dev/rdiskX bs=1m"
