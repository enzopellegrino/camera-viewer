name: Build Distributable Image

# Scarica l'immagine base dalla release, aggiunge il menu installer (GRUB),
# ricomprime e carica il file finale sulla stessa release.
#
# Prerequisito: la release deve contenere "camera-viewer-base.img.xz"
# (immagine prodotta da make-image.sh sul NUC, senza installer).
#
# Output: "camera-viewer-vX.Y.img.xz" caricato sulla stessa release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag della release (es. v2.0)'
        required: true
        default: 'v2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta variabili
        id: vars
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=$VERSION"  >> $GITHUB_OUTPUT
          echo "Tag: $TAG  |  Versione: $VERSION"
          df -h .

      # ── Download immagine base ─────────────────────────────────────────────
      - name: Download immagine base dalla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.vars.outputs.tag }} \
            --pattern "camera-viewer-base.img.xz" \
            --dir /tmp
          ls -lh /tmp/camera-viewer-base.img.xz

      # ── Decomprimi ────────────────────────────────────────────────────────
      - name: Decompressione immagine
        run: |
          echo "Decompressione in corso..."
          xz -d -T0 /tmp/camera-viewer-base.img.xz
          ls -lh /tmp/camera-viewer-base.img
          df -h .

      # ── Monta e modifica ──────────────────────────────────────────────────
      - name: Monta immagine e aggiungi installer
        run: |
          IMG=/tmp/camera-viewer-base.img
          MNT=/mnt/cv-img

          LOOP=$(sudo losetup -f --show -P "$IMG")
          echo "Loop device: $LOOP"

          sudo mkdir -p $MNT
          sudo mount ${LOOP}p2 $MNT
          sudo mkdir -p $MNT/boot/efi
          sudo mount ${LOOP}p1 $MNT/boot/efi

          # ── Script installer ───────────────────────────────────────────
          sudo cp tools/install-camera-viewer.sh $MNT/usr/local/bin/install-camera-viewer.sh
          sudo chmod 755 $MNT/usr/local/bin/install-camera-viewer.sh
          echo "✓ Script installer copiato"

          # ── Servizio systemd ───────────────────────────────────────────
          sudo tee $MNT/etc/systemd/system/cv-installer.service > /dev/null << 'EOF'
          [Unit]
          Description=Camera Viewer Installer
          ConditionKernelCommandLine=cv_install=1
          After=local-fs.target
          DefaultDependencies=no
          Conflicts=camera-bootmode.service camera-webconfig.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/install-camera-viewer.sh
          StandardInput=tty
          StandardOutput=tty
          StandardError=tty
          TTYPath=/dev/tty1
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo mkdir -p $MNT/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/cv-installer.service \
            $MNT/etc/systemd/system/multi-user.target.wants/cv-installer.service
          echo "✓ Servizio systemd abilitato"

          # ── Fix: network-wait-online non blocca il boot senza rete ────
          # Maschera entrambi i wait-online (networkd + NetworkManager)
          # Su kiosk senza ethernet il default può bloccare 2 minuti
          sudo ln -sf /dev/null $MNT/etc/systemd/system/systemd-networkd-wait-online.service
          sudo ln -sf /dev/null $MNT/etc/systemd/system/NetworkManager-wait-online.service 2>/dev/null || true
          echo "✓ network-wait-online mascherato"

          # ── Hotspot WiFi fallback ──────────────────────────────────────
          # Se al boot non c'è rete (né ethernet né WiFi configurato),
          # crea un access point con SSID "CameraViewer-XXXX" / "cameraviewer"
          # così l'utente si connette e accede al portale su http://10.42.0.1
          sudo tee $MNT/usr/local/bin/cv-hotspot.sh > /dev/null << 'HOTSPOT'
#!/bin/bash
# Camera Viewer — WiFi Hotspot Fallback
LOG="/var/log/cv-hotspot.log"
exec >> "$LOG" 2>&1
echo "$(date '+%F %T') — cv-hotspot avviato"

# Aspetta che NetworkManager sia pronto
sleep 12

# Se c'è già una connessione attiva (ethernet o wifi), esci
CONNECTED=$(nmcli -t -f TYPE,STATE connection show --active 2>/dev/null \
    | grep -v "^loopback:" | grep ":activated" | head -1)
if [ -n "$CONNECTED" ]; then
    echo "$(date '+%F %T') — Rete attiva ($CONNECTED), hotspot non necessario"
    exit 0
fi

# Trova interfaccia WiFi
WIFI_IF=$(nmcli -t -f DEVICE,TYPE device status 2>/dev/null \
    | grep ":wifi" | cut -d: -f1 | head -1)
if [ -z "$WIFI_IF" ]; then
    echo "$(date '+%F %T') — Nessuna interfaccia WiFi trovata"
    exit 1
fi

# SSID: CameraViewer + ultime 4 cifre del MAC (es. CameraViewer-A3F2)
MAC=$(cat /sys/class/net/"$WIFI_IF"/address 2>/dev/null | tr -d ':')
SUFFIX=$(echo "${MAC: -4}" | tr '[:lower:]' '[:upper:]')
SSID="CameraViewer-${SUFFIX}"
PASSWORD="cameraviewer"

echo "$(date '+%F %T') — Avvio hotspot: SSID=$SSID su $WIFI_IF"
nmcli connection delete "cv-hotspot" 2>/dev/null || true

nmcli device wifi hotspot \
    ifname "$WIFI_IF" \
    ssid "$SSID" \
    password "$PASSWORD" \
    con-name "cv-hotspot"

if [ $? -eq 0 ]; then
    # NetworkManager assegna 10.42.0.1 come IP default per hotspot
    IP=$(ip -4 addr show "$WIFI_IF" 2>/dev/null \
        | grep -oP '(?<=inet )\d+\.\d+\.\d+\.\d+' | head -1)
    IP="${IP:-10.42.0.1}"
    echo "$(date '+%F %T') — Hotspot attivo: $SSID / $PASSWORD @ $IP"
    # Salva info per il kiosk (mostra SSID/IP sullo schermo)
    printf '{"ssid":"%s","password":"%s","ip":"%s","portal":"http://%s"}\n' \
        "$SSID" "$PASSWORD" "$IP" "$IP" \
        > /run/cv-network-info.json
else
    echo "$(date '+%F %T') — Errore avvio hotspot (nmcli ha fallito)"
    exit 1
fi
HOTSPOT
          sudo chmod 755 $MNT/usr/local/bin/cv-hotspot.sh

          sudo tee $MNT/etc/systemd/system/cv-hotspot.service > /dev/null << 'EOF'
[Unit]
Description=Camera Viewer WiFi Hotspot Fallback
After=NetworkManager.service network.target
Wants=NetworkManager.service

[Service]
Type=simple
ExecStart=/usr/local/bin/cv-hotspot.sh
RemainAfterExit=yes
Restart=on-failure
RestartSec=30

[Install]
WantedBy=multi-user.target
EOF
          sudo mkdir -p $MNT/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/cv-hotspot.service \
            $MNT/etc/systemd/system/multi-user.target.wants/cv-hotspot.service
          echo "✓ Hotspot WiFi fallback configurato (CameraViewer-XXXX / cameraviewer)"

          # ── GRUB: leggi kernel e initrd dal grub.cfg esistente ───────
          GRUB_CFG=$MNT/boot/grub/grub.cfg

          # Rinomina Ubuntu → Camera Viewer nel menuentry principale
          sudo sed -i "s/menuentry 'Ubuntu'/menuentry 'Camera Viewer'/"  $GRUB_CFG
          sudo sed -i 's/menuentry "Ubuntu"/menuentry "Camera Viewer"/'  $GRUB_CFG

          KERNEL=$(sudo grep -oP '/boot/vmlinuz-\S+' $GRUB_CFG | head -1)
          INITRD=$(sudo grep -oP '/boot/initrd\.img-\S+' $GRUB_CFG | head -1)
          echo "Kernel: $KERNEL"
          echo "Initrd: $INITRD"

          if [ -z "$KERNEL" ] || [ -z "$INITRD" ]; then
            echo "::error::Kernel o initrd non trovati in grub.cfg"
            sudo cat $GRUB_CFG || true
            exit 1
          fi

          # Aggiungi in fondo a grub.cfg:
          # - timeout=15 e style=menu (override sicuro — GRUB usa l'ultima assegnazione)
          # - voce installer
          sudo tee -a $GRUB_CFG > /dev/null << EOF

          # ── Camera Viewer: override timeout per mostrare il menu ──────
          set timeout_style=menu
          set timeout=15

          menuentry "  Installa Camera Viewer v${{ steps.vars.outputs.version }} su disco interno" {
              linux $KERNEL root=LABEL=cv-system cv_install=1 systemd.unit=multi-user.target quiet
              initrd $INITRD
          }
          EOF
          echo "✓ Menu GRUB: timeout=15s + voce Installa aggiunti in fondo a grub.cfg"

          # ── Smonta ────────────────────────────────────────────────────
          sudo umount $MNT/boot/efi
          sudo umount $MNT
          sudo losetup -d $LOOP
          echo "✓ Immagine modificata e smontata"

      # ── Ricomprimi ────────────────────────────────────────────────────────
      - name: Ricompressione immagine
        run: |
          echo "Compressione xz -6 in corso (~5 min)..."
          xz -6 -T0 /tmp/camera-viewer-base.img
          OUTPUT="camera-viewer-${{ steps.vars.outputs.tag }}.img.xz"
          mv /tmp/camera-viewer-base.img.xz "$OUTPUT"
          ls -lh "$OUTPUT"

      # ── Pubblica ──────────────────────────────────────────────────────────
      - name: Carica immagine sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT="camera-viewer-${{ steps.vars.outputs.tag }}.img.xz"
          gh release upload ${{ steps.vars.outputs.tag }} "$OUTPUT" --clobber
          echo ""
          echo "✅ Immagine pubblicata:"
          echo "   $(ls -lh $OUTPUT | awk '{print $5, $9}')"
          echo ""
          echo "Per flashare su USB:"
          echo "   bash make-usb.sh /dev/diskX"
          echo "   oppure Balena Etcher → $OUTPUT"
