name: Build ISO

# Costruisce la Live ISO Camera Viewer completamente da zero in CI.
# Usa debootstrap + squashfs + grub-mkrescue via setup/build_image_inside.sh.
#
# Output: camera-viewer-vX.X.iso (~700-900MB, file unico)
# Compatibile con Balena Etcher, Rufus, dd.
#
# Menu GRUB al boot:
#   1. Avvia Camera Viewer (Live)      — kiosk senza installare
#   2. Installa Camera Viewer su disco — copia il sistema sul disco interno
#   3. Modalità sicura (nomodeset)
#
# Stima tempi build:
#   debootstrap + apt:  15-20 min
#   pip (PySide6):       5-10 min
#   mksquashfs:          3-5 min
#   totale:             ~25-35 min

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es. 3.1)'
        required: true
        default: '3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── Libera spazio disco ────────────────────────────────────────────────
      # ubuntu-latest ha ~14GB liberi; la ISO build ne richiede ~8GB durante il build.
      - name: Libera spazio disco
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            2>/dev/null || true
          df -h .

      - name: Checkout
        uses: actions/checkout@v4

      # ── Strumenti build ────────────────────────────────────────────────────
      - name: Installa strumenti build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin grub2-common \
            mtools rsync
          echo "✓ Strumenti build installati"
          df -h .

      # ── Tarball app ────────────────────────────────────────────────────────
      - name: Crea tarball app
        run: |
          tar czf /tmp/camera-viewer-app.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='dist-iso' \
            --exclude='*.iso' \
            --exclude='*.img' \
            --exclude='*.img.xz' \
            -C . .
          ls -lh /tmp/camera-viewer-app.tar.gz
          echo "✓ Tarball app creato"

      # ── Build ISO ──────────────────────────────────────────────────────────
      - name: Build ISO
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sudo bash setup/build_image_inside.sh \
            "$VERSION" \
            /tmp/cv-output \
            /tmp/camera-viewer-app.tar.gz
          echo ""
          ls -lh /tmp/cv-output/
          df -h .

      # ── Crea release e pubblica ISO ────────────────────────────────────────
      - name: Crea release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Camera Viewer v${VERSION}" \
              --notes "$(printf '## Camera Viewer v%s\n\n### Come installare\n\n**Step 1 — Scarica** `camera-viewer-v%s.iso`\n\n**Step 2 — Scrivi su USB** (minimo 2GB)\n- [Balena Etcher](https://etcher.balena.io/) (Mac/Windows/Linux) — GUI\n- Rufus (Windows)\n- `sudo dd if=camera-viewer-v%s.iso of=/dev/sdX bs=4M status=progress` (Linux/Mac)\n\n**Step 3 — Boota il PC dalla USB** (UEFI o BIOS legacy)\n\n**Step 4 — Seleziona dal menu GRUB:**\n- _Avvia Camera Viewer (Live)_ — kiosk senza toccare il disco\n- _Installa Camera Viewer su disco_ — installa sul disco interno\n\n**Step 5 (solo installazione) — Digita `INSTALLA` e attendi (5-15 min)**\n\n**Step 6 (solo installazione) — Rimuovi USB → il PC riavvia dal disco**\n\n### Primo accesso portale\n- URL: mostrato sullo schermo dopo il boot\n- Login: `admin` / `admin` (**cambia subito!**)' \
                "$VERSION" "$VERSION" "$VERSION")"
            echo "✓ Release $TAG creata"
          else
            echo "✓ Release $TAG già esistente"
          fi

      - name: Carica ISO sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          ISO="/tmp/cv-output/camera-viewer-v${VERSION}.iso"
          sudo chown "$USER" "$ISO"
          ISO_SIZE=$(ls -lh "$ISO" | awk '{print $5}')
          echo "ISO: $ISO_SIZE"
          gh release upload "$TAG" "$ISO" --clobber
          echo ""
          echo "✅ Pubblicato: camera-viewer-v${VERSION}.iso (${ISO_SIZE})"
          echo ""
          echo "Scrivi su USB (Linux/Mac):"
          echo "  sudo dd if=camera-viewer-v${VERSION}.iso of=/dev/sdX bs=4M status=progress"
