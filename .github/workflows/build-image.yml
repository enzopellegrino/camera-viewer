name: Build Image from Scratch

# Costruisce l'immagine USB Camera Viewer completamente da zero in CI.
# Usa debootstrap + setup/build_image_inside.sh — nessuna dipendenza da
# un "base image" pre-costruito sul PC. Tutto è nel repo.
#
# Output: camera-viewer-vX.Y.img.xz caricato sulla release GitHub.
#
# Stima tempi:
#   debootstrap + apt:  15-20 min
#   pip (PySide6):       5-10 min
#   compressione xz:    15-20 min (xz -9 su ~6GB raw)
#   totale:             ~40-50 min
#
# Riduzioni dimensione rispetto a v2.x:
#   - Rimossi openvpn + wireguard-tools (~100MB installati)
#   - Rimosso i965-va-driver (~50MB, solo Intel Broadwell 2015 e prima)
#   - Rimosso python3-dev (~50MB, solo per compilazione)
#   - Strip debug symbols da .so del venv PySide6/OpenCV (~200-400MB)
#   Target: ~1.8-2.0GB compressa (era 2.2GB)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es. 3.0)'
        required: true
        default: '3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Libera spazio disco ────────────────────────────────────────────────
      # ubuntu-latest ha ~14GB liberi di default; rimuovendo tool non usati
      # arriviamo a ~30GB — necessario per immagine raw 6GB + build artifacts.
      - name: Libera spazio disco
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            2>/dev/null || true
          df -h .

      - name: Checkout
        uses: actions/checkout@v4

      # ── Strumenti build ────────────────────────────────────────────────────
      - name: Installa strumenti build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            debootstrap parted dosfstools e2fsprogs \
            grub-efi-amd64-bin grub-efi-amd64 grub2-common \
            xz-utils rsync
          echo "✓ Strumenti build installati"
          df -h .

      # ── Tarball app ────────────────────────────────────────────────────────
      # Crea un archivio con l'intero repo (escludi cache, build, immagini).
      # build_image_inside.sh lo estrae in /home/pi/camera-viewer/ sull'immagine.
      - name: Crea tarball app
        run: |
          tar czf /tmp/camera-viewer-app.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.xz' \
            --exclude='*.img' \
            --exclude='*.img.gz' \
            -C . .
          ls -lh /tmp/camera-viewer-app.tar.gz
          echo "✓ Tarball app creato"

      # ── Build immagine da zero ─────────────────────────────────────────────
      # Esegue build_image_inside.sh come root (richiede losetup, mount, chroot).
      # GitHub Actions ubuntu-latest supporta tutti questi comandi natively.
      - name: Build immagine da zero
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # XZ_LEVEL=9: compressione massima — GitHub Release limit è 2GB.
          # xz -9 -T0 su 6GB raw impiega ~15-20 min ma dimezza la dimensione.
          sudo XZ_LEVEL=9 bash setup/build_image_inside.sh \
            "$VERSION" \
            /tmp/cv-output \
            /tmp/camera-viewer-app.tar.gz
          echo ""
          ls -lh /tmp/cv-output/
          df -h .

      # ── Crea release e pubblica ────────────────────────────────────────────
      - name: Crea release se non esiste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Camera Viewer v${VERSION}" \
              --notes "$(printf '## Camera Viewer v%s\n\n### Come installare\n1. Scarica `camera-viewer-%s.img.xz`\n2. Scrivi su USB con Balena Etcher o:\n   ```bash\n   xz -dc camera-viewer-%s.img.xz | sudo dd of=/dev/rdiskX bs=4m\n   ```\n3. Boota il PC dalla USB\n4. Seleziona **Installa Camera Viewer su disco interno**\n5. Digita `INSTALLA` e attendi\n6. Rimuovi la USB → il PC riavvia dal disco\n\n### Primo accesso portale\n- URL: mostrato sullo schermo dopo il boot\n- Login: `admin` / `admin` (cambia subito!)' \
                "$VERSION" "$TAG" "$TAG")"
            echo "✓ Release $TAG creata"
          else
            echo "✓ Release $TAG già esistente"
          fi

      - name: Carica immagine sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          IMG="/tmp/cv-output/camera-viewer-v${VERSION}.img.xz"
          gh release upload "$TAG" "$IMG" --clobber
          echo ""
          echo "✅ Pubblicato: camera-viewer-v${VERSION}.img.xz"
          echo "   $(ls -lh "$IMG" | awk '{print $5}')"
